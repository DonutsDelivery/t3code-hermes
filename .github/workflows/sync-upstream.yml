name: Sync Upstream

# Follows pingdotgg/t3code's nightlies. Each run proposes merging the commit
# upstream's newest nightly was built from, not upstream main: that commit
# passed upstream's release, while main can sit between commits that only work
# together. The sync PR auto-merges once CI passes. Each run also cuts a fork
# nightly for upstream history on main that the fork has not shipped yet.
#
# Merge, not rebase: the fork's history is public and rebasing would rewrite
# commits that are already pushed. A merge also keeps the Hermes commits intact
# and makes the next sync's conflict set smaller.
#
# A conflict files an `upstream-sync-conflict` issue; the Hermes upstream-sync
# resolver picks it up from the webhook, merges its resolution PR once CI is
# green, and dispatches this workflow again to release. Runs leave a conflict
# that is already reported alone until a newer upstream nightly appears.
#
# A sync PR that fails CI gets the next upstream nightly merged into it. One
# open for over three hours files an `upstream-sync-stuck` issue.
#
# This workflow only ever runs on a fork (see the job guard). It is inert if it
# is ever merged back upstream.

on:
  schedule:
    # Upstream checks for a nightly every 30 minutes and ships at most every
    # six hours, so an hourly look picks each one up within about an hour.
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Dispatches release.yml.
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream nightly
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_URL: https://github.com/pingdotgg/t3code
      CONFLICT_LABEL: upstream-sync-conflict
      PARITY_LABEL: hermes-parity-review
    steps:
      # GitHub holds `pull_request` runs on a PR opened with GITHUB_TOKEN until
      # a maintainer approves them, so auto-merge never fires. A GitHub App
      # token opens the PR as the app and CI starts by itself. Upstream edits
      # workflows most days, so the app may push them too. CI's
      # release-runners test keeps such a range from moving a release job
      # onto a runner the fork does not have.
      # Without the app configured, the run falls back to GITHUB_TOKEN, which
      # cannot push workflow edits.
      - id: app-token
        name: Mint sync app token
        if: vars.SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          # Full history: a shallow clone has no merge base with upstream.
          fetch-depth: 0
          persist-credentials: true
          # The sync branch push goes out as the app too.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: upstream
        name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          # Release only upstream history already merged into main, even when
          # newer upstream commits need another PR or conflict resolution.
          echo "merged_sha=$(git merge-base HEAD upstream/main)" >> "$GITHUB_OUTPUT"

          # Upstream's previews build branches; only its nightlies build main.
          tag=$(gh release list --repo pingdotgg/t3code --exclude-drafts --limit 50 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("^v.*-nightly\\."))] | max_by(.publishedAt) | .tagName // empty')
          if [[ -z "$tag" ]]; then
            echo "::error::No published nightly among pingdotgg/t3code's last 50 releases."
            exit 1
          fi
          nightly_sha=$(gh api "repos/pingdotgg/t3code/commits/$tag" --jq .sha)
          if ! git merge-base --is-ancestor "$nightly_sha" upstream/main; then
            echo "::error::Upstream nightly $tag ($nightly_sha) is not on upstream main."
            exit 1
          fi
          echo "nightly_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "nightly_sha=$nightly_sha" >> "$GITHUB_OUTPUT"
          echo "Following upstream nightly $tag ($nightly_sha)."

      # release.yml decides again under its concurrency lock. Asking first
      # keeps hourly runs from leaving a skipped release behind each time.
      - id: release_due
        name: Check for unshipped upstream history
        uses: actions/github-script@v8
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.merged_sha }}
        with:
          script: |
            const { shouldFollowUpstreamNightly } = require('./.github/scripts/check-nightly-release.cjs');
            core.setOutput('due', await shouldFollowUpstreamNightly({ github, context, core, upstreamSha: process.env.UPSTREAM_SHA }));

      - name: Dispatch fork nightly
        if: steps.release_due.outputs.due == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.merged_sha }}
        # A pending sync PR never releases its head.
        run: >-
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f channel=nightly -f follow_upstream=true -f upstream_sha="$UPSTREAM_SHA"

      - id: merge
        name: Merge upstream nightly
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ steps.upstream.outputs.nightly_tag }}
          NIGHTLY_SHA: ${{ steps.upstream.outputs.nightly_sha }}
        run: |
          set -uo pipefail

          before="$(git rev-parse HEAD)"
          upstream_sha="$NIGHTLY_SHA"
          {
            echo "before=$before"
            echo "upstream_sha=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream nightly $TAG ($upstream_sha)."
            exit 0
          fi

          # Whether an open issue with this label already names this text.
          reported() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label "$1" --state open --limit 20 \
              --json body,comments \
              | jq -e --arg text "$2" 'any(.[]; [.body, .comments[].body] | any(contains($text)))' >/dev/null
          }

          sync_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --limit 100 --json url,headRefName,author,createdAt \
            --jq '[.[] | select(.headRefName | startswith("automation/sync-upstream/")) | select(.author.is_bot)]') \
            || exit 1
          # A sync PR opened before the app was configured never gets CI
          # without a manual approval, and reusing it never fixes that.
          # Close it so this run opens a fresh one through the app.
          if [[ -n "$APP_SLUG" ]]; then
            for stale in $(jq -r --arg me "app/$APP_SLUG" '.[] | select(.author.login != $me) | .url' <<<"$sync_prs"); do
              gh pr close "$stale" --comment "Superseded: the sync now opens its PRs through the $APP_SLUG app so CI runs without approval." \
                || exit 1
            done
            sync_prs=$(jq --arg me "app/$APP_SLUG" '[.[] | select(.author.login == $me)]' <<<"$sync_prs")
          fi
          pending_pr=$(jq -r '.[0].url // empty' <<<"$sync_prs")
          if [[ -n "$pending_pr" ]]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "pr_url=$pending_pr" >> "$GITHUB_OUTPUT"
            # CI takes minutes, so a sync PR open for hours has failed or is
            # blocked. Upstream's nightly already passed its own release, so
            # the cause is usually on the fork's side and needs a person.
            created=$(jq -r '.[0].createdAt' <<<"$sync_prs")
            if (( $(date +%s) - $(date -d "$created" +%s) > 3 * 3600 )) \
              && ! reported upstream-sync-stuck "$pending_pr"; then
              echo "stuck=true" >> "$GITHUB_OUTPUT"
            fi

            # A newer upstream nightly may carry the fix, and waiting on the
            # old one never would.
            pending_branch=$(jq -r '.[0].headRefName' <<<"$sync_prs")
            git fetch --no-tags origin "$pending_branch" || exit 1
            if git merge-base --is-ancestor "$upstream_sha" FETCH_HEAD; then
              echo "Waiting for the existing sync PR: $pending_pr"
              exit 0
            fi
            git checkout --quiet -B "$pending_branch" FETCH_HEAD || exit 1
            if ! git merge --no-edit -m "Merge upstream nightly $TAG" "$upstream_sha"; then
              git merge --abort || true
              echo "::warning::Upstream nightly $TAG does not merge cleanly into $pending_pr; waiting on it as is."
              exit 0
            fi
            git push origin "HEAD:$pending_branch" || exit 1
            echo "refreshed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Merged upstream nightly $TAG ($upstream_sha) into $pending_pr."
            exit 0
          fi

          # Without this, every hourly run would comment on the conflict issue,
          # and wake the resolver, until the resolution lands.
          if reported "$CONFLICT_LABEL" "$upstream_sha"; then
            echo "status=conflict-reported" >> "$GITHUB_OUTPUT"
            echo "Merging upstream nightly $TAG already conflicted and is reported; waiting on its resolution."
            exit 0
          fi

          if git merge --no-edit -m "Merge upstream nightly $TAG" "$upstream_sha"; then
            echo "status=ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture the conflicted paths BEFORE aborting — `git merge --abort`
          # clears the index, and with it the only reliable record of them.
          #
          # `git ls-files -u` (not grep for conflict markers): apps/web/src/
          # components/chat/ChatComposer.tsx contains NUL bytes, so grep and rg
          # classify it as binary and silently skip it. Anything that has to
          # sweep for conflicts must read the index, or use `grep -a`.
          git ls-files -u | cut -f2 | sort -u > "$RUNNER_TEMP/conflicts.txt"
          git merge --abort || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"

      - name: Compose merge conflict report
        if: steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          TAG: ${{ steps.upstream.outputs.nightly_tag }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -uo pipefail

          conflicts="$(cat "$RUNNER_TEMP/conflicts.txt")"

          # The Hermes resolver's webhook script parses this body: it needs
          # "Merging `upstream/main` (`<sha>`)", the run URL, and the file list
          # between "Conflicted files:" and "Resolve by hand:". Keep them.
          {
            echo "Merging \`upstream/main\` (\`$UPSTREAM_SHA\`) into \`main\` conflicted."
            echo "That is the commit upstream nightly \`$TAG\` was built from."
            echo "The merge was aborted; \`main\` is unchanged."
            echo
            echo "Conflicted files:"
            echo
            if [[ -n "$conflicts" ]]; then
              printf '%s\n' "$conflicts" | sed 's/^/- `/; s/$/`/'
            else
              echo "- (none recorded — the merge failed for some other reason; see the run log)"
            fi
            echo
            echo "Resolve by hand:"
            echo
            echo "Merge exactly that commit, not the latest \`upstream/main\`: the fork follows upstream's nightlies."
            echo
            echo '```bash'
            echo "git fetch upstream && git merge $UPSTREAM_SHA"
            echo '```'
            echo
            echo "\`ChatComposer.tsx\`, \`ChatView.tsx\`, and \`usageProviders.ts\` carry Hermes"
            echo "branding and provider lists — resolve those by reading both sides, not by"
            echo "taking one wholesale. Close this issue once \`main\` is synced."
            echo
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$RUNNER_TEMP/report.md"

      - name: Report merge conflict
        if: steps.merge.outputs.status == 'conflict'
        uses: ./.github/actions/report-automation-failure
        with:
          title: Upstream sync conflict (${{ github.run_id }})
          body-file: ${{ runner.temp }}/report.md
          label: upstream-sync-conflict
          label-description: Nightly upstream merge stopped on a conflict.
          github-token: ${{ github.token }}

      - name: Fail on merge conflict
        if: steps.merge.outputs.status == 'conflict'
        run: exit 1

      - id: propose
        name: Open sync PR and enable auto-merge
        if: steps.merge.outputs.status == 'ready' || steps.merge.outputs.status == 'pending'
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          PENDING_PR: ${{ steps.merge.outputs.pr_url }}
          REFRESHED_SHA: ${{ steps.merge.outputs.refreshed_sha }}
          TAG: ${{ steps.upstream.outputs.nightly_tag }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          # Open the PR and enable auto-merge as the app when it is configured.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$STATUS" == "pending" ]]; then
            pr_url="$PENDING_PR"
            if [[ -n "$REFRESHED_SHA" ]]; then
              gh pr edit "$pr_url" --title "chore(sync): merge upstream nightly $TAG" \
                || echo "::warning::Could not retitle $pr_url."
            fi
            # Retry a previous CI dispatch/auto-merge setup failure without
            # replacing the PR's head or spawning another PR.
            if [[ $(gh pr view "$pr_url" --json autoMergeRequest --jq '.autoMergeRequest != null') == true ]]; then
              echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sync_branch=$(gh pr view "$pr_url" --json headRefName --jq '.headRefName')
            # The API can still report the old head right after a refresh push.
            head_sha="${REFRESHED_SHA:-$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')}"
          else
            sync_branch="automation/sync-upstream/${GITHUB_RUN_ID}"
            head_sha="$(git rev-parse HEAD)"
            git push origin "HEAD:$sync_branch"
            {
              echo "Merge upstream nightly \`$TAG\` (\`$UPSTREAM_SHA\`) while preserving upstream ancestry."
              echo
              echo "Auto-merge uses a merge commit after all required CI checks pass."
              echo "The next sync run releases merged upstream changes that have not shipped yet."
              echo
              echo "Opened by the upstream-sync workflow. The merge was clean, so no agent was involved."
            } > "$RUNNER_TEMP/sync-pr.md"
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$sync_branch" \
              --title "chore(sync): merge upstream nightly $TAG" \
              --body-file "$RUNNER_TEMP/sync-pr.md")
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          gh pr merge "$pr_url" --auto --merge --match-head-commit "$head_sha"

      # Advisory, after proposing the sync: this heuristic must never prevent
      # a clean merge from reaching its PR.
      - id: drift
        name: Check sibling adapter drift
        if: steps.merge.outputs.status == 'ready' || steps.merge.outputs.refreshed_sha != ''
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.merge.outputs.before }}
        run: |
          set -uo pipefail

          # ORIG_HEAD is the pre-merge main, so this diff is exactly what the
          # incoming upstream commits changed. Fall back to the recorded sha.
          base="$(git rev-parse --verify --quiet ORIG_HEAD || echo "$BEFORE_SHA")"
          git diff --name-only "$base..HEAD" > "$RUNNER_TEMP/incoming.txt"

          # grep -a throughout: some tracked sources contain NUL bytes and grep
          # would otherwise treat the stream as binary and print nothing useful.
          #
          # `|| true` on every grep: the runner's default shell is `bash -e -o
          # pipefail`, which `set -uo pipefail` above does not undo. A grep that
          # matches nothing — the ordinary case for an upstream day that left
          # the adapters alone — exits 1 and would otherwise kill the step.
          adapters="$(
            grep -aE '^apps/server/src/(provider/Drivers|orchestration-v2/Adapters)/(Claude|Codex|Cursor|Grok|OpenCode)' "$RUNNER_TEMP/incoming.txt" \
              | sed -E 's#^apps/server/src/(provider/Drivers|orchestration-v2/Adapters)/(Claude|Codex|Cursor|Grok|OpenCode).*#\2#' \
              | sort -u \
              || true
          )"
          adapter_count="$(printf '%s' "$adapters" | grep -ac . || true)"

          acp_files="$(grep -aE '^apps/server/src/(provider/acp/|orchestration-v2/Adapters/Acp)' "$RUNNER_TEMP/incoming.txt" | grep -av '/Hermes' || true)"

          if [[ "$adapter_count" -ge 2 || -n "$acp_files" ]]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Hermes parity heuristic"
            echo
            echo "- sibling adapters touched: ${adapter_count} (${adapters//$'\n'/, })"
            echo "- ACP runtime files touched: $(printf '%s' "$acp_files" | grep -ac . || true)"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Upstream commits \`${base}..$(git rev-parse HEAD)\` touched the shared provider layer."
            echo
            echo "Sibling adapters touched: **${adapter_count}**"
            echo
            if [[ -n "$adapters" ]]; then
              printf '%s\n' "$adapters" | sed 's/^/- /'
            else
              echo "- (none)"
            fi
            echo
            echo "ACP runtime files touched:"
            echo
            if [[ -n "$acp_files" ]]; then
              printf '%s\n' "$acp_files" | sed 's/^/- `/; s/$/`/'
            else
              echo "- (none)"
            fi
            echo
            echo "Check whether the same change is needed in the Hermes adapter"
            echo "(\`HermesAdapterV2.ts\`, \`HermesDriver.ts\`, \`HermesAcpSupport.ts\`, \`HermesTextGeneration.ts\`)."
            echo "Upstream has previously fixed a bug across every sibling adapter in a"
            echo "commit that merged cleanly while leaving the Hermes copy broken — git"
            echo "cannot see that kind of drift. The sync PR is open; this is advisory."
          } > "$RUNNER_TEMP/parity-issue.md"

      - name: Open Hermes parity review issue
        if: steps.drift.outputs.review == 'true'
        uses: ./.github/actions/report-automation-failure
        with:
          title: Hermes parity review (${{ github.run_id }})
          body-file: ${{ runner.temp }}/parity-issue.md
          label: hermes-parity-review
          label-color: fbca04
          label-description: Upstream changed sibling provider adapters; check the Hermes copy.
          github-token: ${{ github.token }}

      # Not gated on success: a refresh push that fails still leaves the PR stuck.
      - name: Compose stuck sync PR report
        if: ${{ !cancelled() && steps.merge.outputs.stuck == 'true' }}
        shell: bash
        env:
          PR_URL: ${{ steps.merge.outputs.pr_url }}
        run: |
          {
            echo "Sync PR $PR_URL has been open for over three hours, so \`main\` and fork nightlies are behind upstream."
            echo "Releases wait until it merges: they only ship upstream history that is on \`main\`."
            echo
            echo "It merges an upstream nightly, which already passed upstream's own release, so the failure is"
            echo "most likely in the fork. Fix its checks on the sync branch, and close this issue once it merges."
            echo "Each newer upstream nightly is merged into it unless that conflicts (the run log warns)."
            echo
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$RUNNER_TEMP/stuck.md"

      - name: Report stuck sync PR
        if: ${{ !cancelled() && steps.merge.outputs.stuck == 'true' }}
        uses: ./.github/actions/report-automation-failure
        with:
          title: Upstream sync PR stuck (${{ github.run_id }})
          body-file: ${{ runner.temp }}/stuck.md
          label: upstream-sync-stuck
          label-description: An upstream sync PR has not merged for over three hours.
          github-token: ${{ github.token }}

      - name: Summarize
        if: always() && (steps.merge.outputs.status == 'ready' || steps.merge.outputs.status == 'pending' || steps.merge.outputs.status == 'up-to-date' || steps.merge.outputs.status == 'conflict-reported')
        shell: bash
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          TAG: ${{ steps.upstream.outputs.nightly_tag }}
          PR_URL: ${{ steps.propose.outputs.pr_url || steps.merge.outputs.pr_url }}
        run: |
          if [[ "$STATUS" == "up-to-date" ]]; then
            echo "Already up to date with upstream nightly \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$STATUS" == "conflict-reported" ]]; then
            echo "Merging upstream nightly \`$TAG\` conflicted earlier; waiting on its resolution." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sync PR: $PR_URL. Main advances after required checks pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything above reports the failures it anticipates. This catches the
      # ones it does not: a crashed step, a rejected push, a `gh` outage. The
      # conflict path is excluded because it has already filed its own report.
      - name: Compose unexpected failure report
        if: failure() && steps.merge.outputs.status != 'conflict'
        shell: bash
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -uo pipefail

          {
            echo "The nightly upstream merge failed somewhere other than a merge conflict."
            echo
            echo "- Merge status: \`${STATUS:-(never reached)}\`"
            echo "- Upstream nightly: \`${UPSTREAM_SHA:-(unknown)}\`"
            echo
            echo "Check the sync PR step for a branch push, PR creation, CI dispatch, or auto-merge failure."
            echo
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "$RUNNER_TEMP/failure.md"

      - name: Report unexpected failure
        if: failure() && steps.merge.outputs.status != 'conflict'
        uses: ./.github/actions/report-automation-failure
        with:
          title: Upstream sync failed (${{ github.run_id }})
          body-file: ${{ runner.temp }}/failure.md
          label: upstream-sync-failed
          label-description: The nightly upstream merge failed unexpectedly.
          github-token: ${{ github.token }}
